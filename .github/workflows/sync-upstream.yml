name: Sync upstream from Convex

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Convex rules and convert to SKILL.md
        run: |
          curl -sSL -o /tmp/convex_rules.mdc "https://convex.link/convex_rules.mdc"
          # MDC has --- description globs --- then body. Convert to skill format.
          awk '
            /^---$/ { count++; next }
            count==1 && /^description:/ { desc=$0; next }
            count==1 { next }
            count>=2 { body = body $0 "\n" }
            END {
              print "---"
              print "name: convex-rules"
              print desc
              print "---"
              print ""
              print body
            }
          ' /tmp/convex_rules.mdc > SKILL.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SKILL.md
          git diff --cached --quiet || git commit -m "sync: update SKILL.md from Convex convex_rules.mdc"
          git push
