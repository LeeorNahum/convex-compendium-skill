name: Sync upstream from Convex

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vendor Convex agent skills and guidelines
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync.mjs

      - name: Verify ai-files recommendations are neutralized
        run: |
          if grep -rn "ai-files install" references; then
            echo "Found un-rewritten ai-files install recommendation" >&2
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add references
          git diff --cached --quiet || git commit -m "sync: refresh vendored Convex skills and guidelines (get-convex/agent-skills@${{ steps.sync.outputs.upstream_sha }})"
          git push
