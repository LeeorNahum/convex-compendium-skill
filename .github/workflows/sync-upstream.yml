name: Sync upstream from Convex

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: convex-compendium-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test synchronization and eval structure
        run: node --test scripts/sync.test.mjs scripts/evals.test.mjs

      - name: Vendor Convex guidance
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync.mjs

      - name: Verify pinned generated output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/sync.mjs --check
          --agent-skills-sha "${{ steps.sync.outputs.agent_skills_sha }}"
          --convex-evals-sha "${{ steps.sync.outputs.convex_evals_sha }}"

      - name: Verify generated invariants
        run: |
          git diff --check
          if grep -R -i -E "ai-files[[:space:]]+install" references/; then
            exit 1
          fi

      - name: Commit and push generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add references/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "sync: refresh vendored Convex sources (agent-skills@${{ steps.sync.outputs.agent_skills_sha }}, convex-evals@${{ steps.sync.outputs.convex_evals_sha }})"
          git push
